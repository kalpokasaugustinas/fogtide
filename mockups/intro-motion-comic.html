<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogtide intro: motion comic (5 looks)</title>
<style>
  /* mockup shell: top bar with one button per option + player controls, a 1280x720 frame scaled to fit
     (pc or phone). the intro is drawn live on one canvas; sample content only. */
  @font-face { font-family: 'Josefin Sans'; font-weight: 100 700; src: url(../fonts/josefin-sans.woff2) format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0e10; font-family: 'Josefin Sans', system-ui, sans-serif; overflow: hidden; }
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #15191c; color: #ddd; }
  .top button { font: inherit; font-size: 14px; padding: 6px 11px; border: 1px solid #39434a; border-radius: 4px; background: #1e252a; color: #ddd; cursor: pointer; }
  .top button.on { background: #e6e1d3; color: #15191c; }
  .top .sep { width: 1px; height: 22px; background: #39434a; margin: 0 4px; }
  .top .sc { min-width: 30px; padding: 6px 8px; }
  .top .sc.on { background: #39434a; color: #fff; }
  .top small { flex-basis: 100%; color: #9aa6ab; font-size: 13px; }
  .stage { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar, 60px); }
  .frame { position: absolute; width: 1280px; height: 720px; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; background: #000; }
  .frame canvas { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .skip { position: absolute; z-index: 2; right: 26px; top: 18px; font: inherit; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; background: none; border: 0; color: #d8d4c8; opacity: .7; cursor: pointer; padding: 6px 4px; text-shadow: 0 1px 6px #000; }
  .skip:hover { opacity: 1; }
  .start { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: rgba(5,6,8,.55); cursor: pointer; color: #f0ece0; }
  .start span { font-size: 22px; letter-spacing: 4px; text-transform: uppercase; padding: 18px 34px; border: 1px solid rgba(240,236,224,.5); background: rgba(5,6,8,.4); }
  .start:hover span { background: rgba(240,236,224,.08); }
  .start small { color: #b0b4b8; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .start.hide { display: none; }
</style>
</head>
<body>
  <div class="top" id="bar">
    <b>Intro: motion comic</b>
    <button data-v="a" class="on">A · Painted plates</button>
    <button data-v="b">B · Graphic novel</button>
    <button data-v="c">C · Ink wash</button>
    <button data-v="d">D · Shadow play</button>
    <button data-v="e">E · Engraved chronicle</button>
    <span class="sep"></span>
    <button id="play">▶ Play</button>
    <button id="snd">Sound: on</button>
    <span class="sep"></span>
    <span id="scenes"></span>
    <small>Same 6 scenes and lines in every option (~50 s): still painted plates, slow parallax pan, drifting fog, one line per scene, Skip / Esc. Click 1-6 to jump to a scene. Drawn live with the game's own foglets, houses, obelisk and map.</small>
  </div>
  <div class="stage" id="stage"><div class="frame" id="frame">
    <canvas id="cv" width="1280" height="720"></canvas>
    <button class="skip" id="skip">Skip ›</button>
    <div class="start" id="start"><span>▶ Play intro</span><small>Esc skips · sound on</small></div>
  </div></div>
<script type="module">
// =====================================================================================
// FOGTIDE INTRO AS A MOTION COMIC (task #80). one storyboard of 6 still scenes; each scene is a set of
// painted layers (plates) at different depths, moved by a slow camera (parallax), with live fog / eyes /
// fire / beam effects between the layers. 5 options = 5 looks + presentations of the same storyboard:
//   a painted plates (full colour, depth blur, letterbox)  b graphic novel (cel shading, ink outlines,
//   panels on a page, speech balloons)  c ink wash (sepia ink on paper, line boil, ink-bleed cuts)
//   d shadow play (silhouettes on glowing skies)  e engraved chronicle (hatched plates in a book)
// =====================================================================================
import { drawFoglet } from '../js/render.js';
import { previewBuildings, drawObelisk } from '../js/structures.js';

const W = 1280, H = 720, PW = 1700, PH = 1080;           // screen size, plate (layer) size
const BLUE = '#2f74d6', GREY = 'rgb(126,128,140)';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(k));        // sine in-out: calm camera moves
const span = (t, a, b) => clamp((t - a) / (b - a));
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
function rng(seed) { let a = (seed * 9973) >>> 0 || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// soft round puff in any colour (cached), used for fog, smoke and glows
const puffs = new Map();
function puffC(col) {
  const k = col.join(',');
  if (!puffs.has(k)) { const c = mk(128, 128), x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, css(col, 0.9)); g.addColorStop(0.5, css(col, 0.42)); g.addColorStop(1, css(col, 0)); x.fillStyle = g; x.fillRect(0, 0, 128, 128); puffs.set(k, c); }
  return puffs.get(k);
}
function glow(x, gx, gy, r, col, a) {
  if (r <= 0 || a <= 0) return;
  const g = x.createRadialGradient(gx, gy, 0, gx, gy, r); g.addColorStop(0, css(col, a)); g.addColorStop(1, css(col, 0));
  x.fillStyle = g; x.fillRect(gx - r, gy - r, r * 2, r * 2);
}

// =====================================================================================
// GAME ART: cached foglet sprites (drawFoglet), houses (previewBuildings), obelisk (drawObelisk)
// a sprite canvas is 16S x 16S with the foot point at (8S, 13S); the raw sprite faces right
// =====================================================================================
const sprites = new Map();
function sprite(kit, col, S, cape = false, fogbound = false) {
  const key = [kit, col, S, cape, fogbound].join('|');
  if (!sprites.has(key)) {
    const c = mk(16 * S, 16 * S), x = c.getContext('2d'), fx = 8 * S, fy = 13 * S;
    if (cape) {                                             // hero cape behind the body (war council generals)
      x.fillStyle = '#1d3f78'; x.beginPath();
      [[-1.55, -4.3], [1.55, -4.3], [2.5, 0.1], [0.8, -0.25], [0, 0.15], [-0.8, -0.25], [-2.6, 0.05]].forEach(([px, py], i) => (i ? x.lineTo : x.moveTo).call(x, fx + px * S, fy + py * S));
      x.closePath(); x.fill();
    }
    drawFoglet(x, fx, fy, S, col, kit, { noFace: fogbound });
    sprites.set(key, c);
  }
  return sprites.get(key);
}
// draw a sprite with its feet at (px, py); returns the two eye points (for live Fogbound eye glows)
function place(x, sp, S, px, py, { flip = false, rot = 0, k = 1 } = {}) {
  x.save(); x.translate(px, py); x.rotate(rot); x.scale(flip ? -k : k, k); x.drawImage(sp, -8 * S, -13 * S); x.restore();
  return [-0.55, 0.55].map((ex) => { const lx = (flip ? -ex : ex) * S * k, ly = -5.1 * S * k;
    return { x: px + lx * Math.cos(rot) - ly * Math.sin(rot), y: py + lx * Math.sin(rot) + ly * Math.cos(rot), r: S * k * 0.2 }; });
}
const housePal = ['classic', 'tudor', 'nordic'];
function house(pal) {
  const key = 'h|' + pal;
  if (!sprites.has(key)) { const c = mk(330, 300); previewBuildings(c.getContext('2d'), 330, 300, pal, BLUE); sprites.set(key, c); }
  return sprites.get(key);
}
function obelisk(look, u) {
  const key = `o|${look}|${u}`;
  if (!sprites.has(key)) { const c = mk(12 * u, 12 * u); drawObelisk(c.getContext('2d'), 6 * u, 10 * u, u, look); sprites.set(key, c); }
  return sprites.get(key);
}
const drawOb = (x, look, u, cx, cy) => x.drawImage(obelisk(look, u), cx - 6 * u, cy - 10 * u);

// =====================================================================================
// PAINTING HELPERS (plate space 1700x960)
// =====================================================================================
// a smooth hill line: base - amp * (sum of sines); returns y(px)
function ridgeFn(base, amp, seed, rough = 0.12) {
  const r = rng(seed), a = r() * 9, b = r() * 9, c = r() * 9;
  return (px) => base - amp * (0.5 + 0.3 * Math.sin(px * 0.0037 + a) + 0.2 * Math.sin(px * 0.011 + b) + rough * Math.sin(px * 0.047 + c));
}
// sharp mountain peaks (1 - |sin| has a point at every zero), two sizes mixed so they don't repeat
function peaksFn(base, amp, seed) {
  const r = rng(seed), a = r() * 9, b = r() * 9, c = r() * 9;
  return (px) => base - amp * (0.55 * (1 - Math.abs(Math.sin(px * 0.0042 + a))) ** 1.6 + 0.3 * (1 - Math.abs(Math.sin(px * 0.0093 + b))) ** 1.4 + 0.15 * (0.5 + 0.5 * Math.sin(px * 0.031 + c)));
}
function fillRidge(x, fn, col, x0 = -80, x1 = PW + 80) {
  x.fillStyle = typeof col === 'string' ? col : css(col); x.beginPath(); x.moveTo(x0, PH + 20);
  for (let px = x0; px <= x1; px += 6) x.lineTo(px, fn(px));
  x.lineTo(x1, PH + 20); x.closePath(); x.fill();
}
// a vertical light-to-dark fill under a ridge (gives the ground some volume)
function shadeRidge(x, fn, top, bot, y0, y1) {
  x.save(); const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, css(top)); g.addColorStop(1, css(bot)); fillRidge(x, fn, 'rgba(0,0,0,0)');
  x.clip(); x.fillStyle = g; x.fillRect(-100, y0 - 200, PW + 200, y1 - y0 + 400); x.restore();
}
function pine(x, px, py, h, col) {
  const w = h * 0.36, tiers = 4, pts = [[0, -h]];
  for (let i = 1; i <= tiers; i++) { const ty = -h + h * i / tiers * 0.86, tw = w * (0.32 + 0.68 * i / tiers); pts.push([tw, ty]); if (i < tiers) pts.push([tw * 0.38, ty - h * 0.03]); }
  pts.push([w * 0.08, -h * 0.12], [w * 0.08, 0]);
  const all = pts.concat(pts.slice().reverse().map(([a, b]) => [-a, b]));
  x.fillStyle = css(col); x.beginPath(); all.forEach(([a, b], i) => (i ? x.lineTo : x.moveTo).call(x, px + a, py + b)); x.closePath(); x.fill();
}
function fogBank(x, y, h, col, a, seed, n = 40, rmin = 80, rmax = 200, x0 = -200, x1 = PW + 200) {
  const r = rng(seed), p = puffC(col);
  for (let i = 0; i < n; i++) { const px = lerp(x0, x1, r()), py = y + r() * h, rr = lerp(rmin, rmax, r()); x.globalAlpha = a * (0.6 + 0.4 * r()); x.drawImage(p, px - rr * 1.4, py - rr * 0.7, rr * 2.8, rr * 1.4); }
  x.globalAlpha = 1;
}
// grass blades along the top of a ridge
function blades(x, fn, cols, seed, { step = 3, hmin = 6, hmax = 22, lean = 0.25, x0 = -40, x1 = PW + 40, w = 2 } = {}) {
  const r = rng(seed); x.lineCap = 'round';
  for (let px = x0; px < x1; px += step * (0.5 + r())) {
    const y = fn(px) + 3, h = lerp(hmin, hmax, r()), l = (r() - 0.5) * 2 * lean * h + lean * h * 0.4;
    x.strokeStyle = css(cols[(r() * cols.length) | 0]); x.lineWidth = w * (0.6 + r() * 0.8);
    x.beginPath(); x.moveTo(px, y); x.quadraticCurveTo(px + l * 0.3, y - h * 0.6, px + l, y - h); x.stroke();
  }
}
function skyGrad(x, stops) {
  const g = x.createLinearGradient(0, 0, 0, PH); stops.forEach(([o, c]) => g.addColorStop(o, css(c)));
  x.fillStyle = g; x.fillRect(0, 0, PW, PH);
}
function streaks(x, col, a, seed, n, y0, y1) {   // long thin clouds
  const r = rng(seed), p = puffC(col);
  for (let i = 0; i < n; i++) { const px = r() * PW, py = lerp(y0, y1, r()), w = 200 + r() * 420, h = 10 + r() * 26; x.globalAlpha = a * (0.4 + 0.6 * r()); x.drawImage(p, px - w / 2, py - h / 2, w, h); }
  x.globalAlpha = 1;
}
function darken(x, col, a) { x.save(); x.globalCompositeOperation = 'source-atop'; x.fillStyle = css(col, a); x.fillRect(0, 0, PW, PH); x.restore(); }
function stake(x, px, top, bot, w, col, lit) {
  x.fillStyle = css(col); x.beginPath(); x.moveTo(px - w / 2, bot); x.lineTo(px - w / 2, top + w * 0.9); x.lineTo(px, top); x.lineTo(px + w / 2, top + w * 0.9); x.lineTo(px + w / 2, bot); x.closePath(); x.fill();
  if (lit) { x.fillStyle = css(lit); x.beginPath(); x.moveTo(px - w / 2, bot); x.lineTo(px - w / 2, top + w * 0.9); x.lineTo(px, top); x.lineTo(px - w * 0.25, top + w); x.lineTo(px - w * 0.25, bot); x.fill(); }
}
function arrowAt(x, px, py, ang, len, col = [216, 200, 160]) {
  x.save(); x.translate(px, py); x.rotate(ang); x.strokeStyle = css(col); x.lineWidth = len * 0.04; x.beginPath(); x.moveTo(-len, 0); x.lineTo(0, 0); x.stroke();
  x.fillStyle = '#c4ccd4'; x.beginPath(); x.moveTo(len * 0.14, 0); x.lineTo(0, -len * 0.05); x.lineTo(0, len * 0.05); x.fill();
  x.fillStyle = BLUE; x.fillRect(-len, -len * 0.06, len * 0.18, len * 0.12); x.restore();
}

// =====================================================================================
// LIVE EFFECTS (drawn every frame in plate space, between the layers)
// colours follow the look: fog / fire / glow composite
// =====================================================================================
let LOOK = 'paint';
const paper = () => LOOK === 'ink' || LOOK === 'engrave';
const fogCol = (sc) => LOOK === 'ink' ? [214, 204, 184] : LOOK === 'engrave' ? [236, 228, 208] : LOOK === 'shadow' ? mixc(sc.fog, [255, 255, 255], 0.15) : sc.fog;
const fireCol = (k) => LOOK === 'engrave' ? [178, 52, 34] : LOOK === 'ink' ? [176, 66, 40] : k ? [244, 179, 60] : [232, 116, 44];
const VIOLET = [176, 128, 255];
function addGlow(x, gx, gy, r, col, a) {     // additive light on dark looks, a coloured wash on paper looks
  if (paper()) { glow(x, gx, gy, r, col, a * 0.45); return; }
  x.globalCompositeOperation = 'lighter'; glow(x, gx, gy, r, col, a); x.globalCompositeOperation = 'source-over';
}
// drifting band of fog puffs, wraps around horizontally
function fogDrift(x, sc, t, { y, h, n = 16, r0 = 120, r1 = 240, a = 0.4, speed = 8, seed = 1, col } = {}) {
  const p = puffC(col || fogCol(sc)), span0 = PW + 800;
  for (let i = 0; i < n; i++) {
    const r = lerp(r0, r1, hash(i + seed * 31)), px = ((hash(i + seed * 17) * span0 + t * speed * (0.7 + 0.6 * hash(i + seed))) % span0) - 400;
    const py = y + hash(i + seed * 13) * h + Math.sin(t * 0.3 + i) * 8;
    x.globalAlpha = a * (0.55 + 0.45 * hash(i + seed * 7)); x.drawImage(p, px - r * 1.5, py - r * 0.6, r * 3, r * 1.2);
  }
  x.globalAlpha = 1;
}
// violet Fogbound eyes: soft halo + bright core, blink now and then
function eyes(x, list, t, a = 1, blinkSeed = 0) {
  for (let i = 0; i < list.length; i += 2) {
    const e0 = list[i], e1 = list[i + 1], ph = (t * (0.35 + hash(i + blinkSeed) * 0.25) + hash(i * 3 + blinkSeed)) % 1;
    const open = ph < 0.04 ? Math.abs(ph - 0.02) / 0.02 : 1, al = a * (e0.a ?? 1);
    if (al <= 0.01) continue;
    for (const e of [e0, e1]) {
      const r = e.r * 1.25;
      addGlow(x, e.x, e.y, r * 2.4, VIOLET, 0.55 * al);
      x.fillStyle = css(LOOK === 'engrave' ? [120, 60, 200] : [246, 238, 255], al); x.beginPath(); x.ellipse(e.x, e.y, r * 0.42, r * 0.42 * open, 0, 0, 6.283); x.fill();
    }
  }
}
function flames(x, fx, fy, s, t, k = 1) {
  for (let i = 0; i < 5; i++) {
    const fl = (30 + 16 * Math.sin(t * 8 + i * 2.1)) * s * k, ox = (i - 2) * 10 * s;
    x.fillStyle = css(fireCol(i % 2)); x.beginPath(); x.moveTo(fx + ox - 9 * s, fy);
    x.quadraticCurveTo(fx + ox - 8 * s, fy - fl * 0.6, fx + ox + Math.sin(t * 6 + i) * 4 * s, fy - fl); x.quadraticCurveTo(fx + ox + 8 * s, fy - fl * 0.6, fx + ox + 9 * s, fy); x.closePath(); x.fill();
  }
  addGlow(x, fx, fy - 20 * s, 160 * s, [255, 140, 50], 0.35 * (0.9 + 0.1 * Math.sin(t * 13)));
}
function smoke(x, sx, sy, t, s, col, a = 0.4, seed = 0) {
  const p = puffC(col);
  for (let i = 0; i < 7; i++) { const ph = (t * 0.06 + i / 7 + hash(seed)) % 1, r = (14 + ph * 70) * s;
    x.globalAlpha = a * Math.sin(ph * Math.PI) ** 0.7; x.drawImage(p, sx + Math.sin(ph * 4 + seed) * 18 * s + ph * 60 * s - r, sy - ph * 300 * s - r, r * 2, r * 2); }
  x.globalAlpha = 1;
}
function embers(x, t, area, n, seed, size = 3) {
  for (let i = 0; i < n; i++) {
    const ph = (t * (0.06 + hash(i + seed) * 0.06) + hash(i * 2 + seed)) % 1;
    const px = area.x + hash(i * 3 + seed) * area.w + Math.sin(t * 0.8 + i) * 30, py = area.y + area.h - ph * area.h;
    const r = size * (0.5 + hash(i + 9 + seed)), a = Math.sin(ph * Math.PI) * (0.6 + 0.4 * Math.sin(t * 9 + i));
    addGlow(x, px, py, r * 4, [255, 170, 70], 0.5 * a); x.fillStyle = css(paper() ? fireCol(0) : [255, 226, 160], a); x.beginPath(); x.arc(px, py, r * 0.6, 0, 6.283); x.fill();
  }
}

// =====================================================================================
// THE STORYBOARD: 6 scenes + title. each layer: p = depth (0 far .. 1 near), paint (once, cached) or
// fx (live). cam = [[x, y, zoom] start, end] in plate space. hor / dark / fog = scene colours used by the
// looks (haze, silhouettes, fog). q = the line is spoken by the last Fogbound
// =====================================================================================
const SC = [];

// ---- 1. the village at dusk, fog walls all around the horizon ----
SC.push({ name: 'Village', d: 8, cap: 'Our village kept to itself. Beyond the hills there was only fog.', hor: [236, 204, 160], dark: [44, 40, 52], fog: [222, 214, 206],
  cam: [[960, 590, 1.04], [780, 572, 1.1]], data: {},
  layers: [
    { p: 0, sky: true, paint(x) {
      skyGrad(x, [[0, [64, 78, 116]], [0.3, [150, 130, 140]], [0.5, [222, 168, 132]], [0.6, [246, 200, 146]], [1, [246, 214, 168]]]);
      glow(x, 1180, 470, 420, [255, 214, 150], 0.55); glow(x, 1180, 470, 90, [255, 236, 200], 0.9);
      streaks(x, [250, 214, 196], 0.55, 3, 22, 140, 380);
    } },
    { p: 0.12, paint(x) {
      // the fog wall: tall banks rising behind the far mountains, thickest at both edges of the world
      for (let i = 0; i < 70; i++) { const u = hash(i + 1), px = u * PW, edge = Math.abs(u - 0.5) * 2, py = 470 - edge * 220 - hash(i + 2) * 120, r = 130 + hash(i + 3) * 160 + edge * 90;
        x.globalAlpha = 0.35 + 0.6 * edge; x.drawImage(puffC([230, 220, 210]), px - r * 1.3, py - r * 0.8, r * 2.6, r * 1.6); }
      x.globalAlpha = 1;
      const m = peaksFn(560, 300, 11); fillRidge(x, m, [118, 112, 146]);
      const m2 = peaksFn(575, 190, 12); fillRidge(x, m2, [100, 102, 132]);
      fogBank(x, 500, 70, [232, 222, 208], 0.75, 13, 50, 90, 170);
    } },
    { p: 0.3, paint(x, sc) {
      const f = ridgeFn(600, 70, 21); shadeRidge(x, f, [118, 132, 116], [96, 108, 100], 520, 760);
      const r = rng(22); for (let i = 0; i < 70; i++) { const px = r() * PW; if (px > 640 && px < 1180 && r() < 0.8) continue; pine(x, px, f(px) + 6 + r() * 30, 34 + r() * 46, mixc([70, 88, 84], [92, 106, 104], r())); }
    } },
    { p: 0.36, fx(x, sc, t) { fogDrift(x, sc, t, { y: 560, h: 60, n: 14, r0: 90, r1: 180, a: 0.35, speed: 6, seed: 2 }); } },
    { p: 0.5, paint(x, sc) {
      const f = ridgeFn(700, 70, 31, 0.08); sc.data.vf = f;
      shadeRidge(x, f, [146, 158, 104], [108, 122, 82], 600, 900);
      blades(x, f, [[132, 146, 92], [158, 168, 110]], 33, { step: 5, hmin: 4, hmax: 10 });
      // a path winding down from the village
      x.strokeStyle = 'rgba(196,176,132,0.65)'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(980, f(980) + 10); x.bezierCurveTo(900, 760, 1100, 820, 960, 960); x.stroke();

      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = k === 5 || k === 6 ? 1600 : 900; const g = env(s.a, 1.8, k === 6 ? 0.1 : 0.06, s.d - 1.2, 1.8); lp.connect(g);
      for (const f of chords[k]) { osc('triangle', f, s.a, s.b + 0.6, lp); osc('sine', f * 1.003, s.a, s.b + 0.6, lp); }
      if (k > 0 && s.a >= from) { const o = ac.createOscillator(); o.type = 'sine'; const st = at(s.a); o.frequency.setValueAtTime(70, st); o.frequency.exponentialRampToValueAtTime(32, st + 1.4); const bg = env(s.a, 0.01, 0.45, 0.05, 1.6); o.connect(bg); o.start(st); o.stop(st + 2); this.nodes.push(o);
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; const wg = env(s.a - 0.7, 0.65, 0.12, 0.05, 0.5); f.connect(wg); nsrc(s.a - 0.7, s.a + 0.4, f); }
    });
    // eyes: thin eerie tone; siege: drums
    { const s = SC[1]; if (s.b > from) { const g = env(s.a + 1, 2.5, 0.025, s.d - 2, 1); const o = osc('sine', 1318, s.a + 1, s.b + 1, g); const l = ac.createOscillator(); l.frequency.value = 5; const lg = ac.createGain(); lg.gain.value = 12; l.connect(lg); lg.connect(o.frequency); l.start(at(s.a)); l.stop(T0 + s.b + 1); this.nodes.push(l); } }
    { const s = SC[2]; for (let tt = s.a + 0.2; tt < s.b; tt += 0.48) { if (tt < from) continue; const o = ac.createOscillator(); o.type = 'sine'; const st = at(tt); o.frequency.setValueAtTime(110, st); o.frequency.exponentialRampToValueAtTime(48, st + 0.25); const g = ac.createGain(); g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.32, st + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.4); o.connect(g); g.connect(bus); o.start(st); o.stop(st + 0.5); this.nodes.push(o); } }
  },
};

// boot: fonts + first plates, then run
await document.fonts.load('22px "Josefin Sans"').catch(() => {});
setV(V); fit();
if (T > 0) { document.getElementById('start').classList.add('hide'); }
if (qs.has('play')) setPlaying(true);
requestAnimationFrame((n) => { last = n; loop(n); });
window.__mc = { seek, get t() { return T; }, END, setV, ready: () => true };
