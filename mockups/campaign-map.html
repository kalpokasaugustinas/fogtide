<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogtide campaign map</title>
<style>
  /* campaign screen mockup, v2 (picked layout A: chronicle column on the left). the map is a real
     game capture (idle stage 1 and stage 12, tools: headless play + test win), obelisks sit on the
     real capital tiles from that capture. stages 1-11 all live inside the home tile (each zoom-out
     shrinks the old island into one tile), so their obelisks merge into one with a count. sample data */
  @font-face { font-family: 'Josefin Sans'; font-weight: 300 700; src: url(../fonts/josefin-sans.woff2) format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101417; font-family: 'Josefin Sans', system-ui, sans-serif; }
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #161c20; color: #ddd; }
  .top b { margin-right: 8px; font-size: 14px; }
  .top button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #3a464d; background: #222b30; color: #cfd8dc; cursor: pointer; }
  .top button.on { background: #c9a45c; color: #1a1408; border-color: #c9a45c; font-weight: 600; }
  .top small { color: #8a979d; font-size: 12px; flex-basis: 100%; }
  .stage { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar, 70px); overflow: hidden; }
  .frame { position: absolute; width: 1280px; height: 720px; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; color: #232a2c; font-size: 14px; background: #b3bcc3; }

  /* map: real capture + fog canvas + obelisk canvas + clickable dot, shifted right of the column */
  .map { position: absolute; left: 190px; top: 0; width: 1280px; height: 720px; transition: transform 1.4s cubic-bezier(.6,0,.3,1); }
  .map img, .map canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .map .fogc { animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-8px, 0) scale(1.01); } to { transform: translate(8px, -4px) scale(1.025); } }
  /* your tile: a soft pulse on its real outline; click it to start */
  .home { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 3; pointer-events: none; overflow: visible; }
  .home path { pointer-events: all; cursor: pointer; fill: rgba(255, 246, 214, .0); stroke: rgba(255, 250, 230, .9); stroke-width: 2.5; animation: pulse 1.8s ease-in-out infinite; }
  .home path:hover { fill: rgba(255, 246, 214, .28); }
  @keyframes pulse { 0%, 100% { fill: rgba(255, 246, 214, .02); stroke-opacity: .35; stroke-width: 1.5; } 50% { fill: rgba(255, 246, 214, .22); stroke-opacity: 1; stroke-width: 3.5; } }
  .tag { position: absolute; transform: translate(-50%, 0); white-space: nowrap; font-size: 12px; font-weight: 600; letter-spacing: .5px; padding: 2px 8px; border-radius: 10px; z-index: 3; pointer-events: none; }
  .tag.lit { background: rgba(35,42,44,.85); color: #ffd76a; }
  .tag.dark { background: rgba(35,42,44,.7); color: #c9c3d6; }

  /* fog & ink bits (same as the game ui) */
  .ink { display: inline-block; padding: 12px 26px; color: #f0f0ea; text-transform: uppercase; letter-spacing: 3px; font-weight: 600; font-size: 16px; cursor: pointer; position: relative; isolation: isolate; border: 0; background: none; font-family: inherit; }
  .ink::before { content: ''; position: absolute; inset: 0; z-index: -1; background: #232a2c; filter: blur(3px); border-radius: 58% 42% 55% 45% / 46% 60% 40% 54%; }
  .ink:hover::before { background: #2f74d6; }
  .year { font-size: 44px; font-weight: 300; letter-spacing: 1px; line-height: 1; }
  .tide { font-size: 13px; text-transform: uppercase; letter-spacing: 2.5px; font-weight: 600; color: #4a4f63; }
  .lore { font-size: 14px; line-height: 1.45; color: #384044; }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #6a7478; margin: 0 0 6px; }
  .mod { position: relative; display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; cursor: default; }
  .mod svg { width: 18px; height: 18px; flex: none; fill: none; stroke: #4a4f63; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .mod .tip { display: none; position: absolute; left: 0; bottom: 100%; width: 250px; padding: 8px 10px; background: #232a2c; color: #eee; font-size: 12px; line-height: 1.4; border-radius: 6px; z-index: 9; }
  .mod:hover .tip { display: block; }
  .mod.up svg { stroke: #2f74d6; }

  /* the chronicle column */
  .col { position: absolute; left: 0; top: 0; bottom: 0; width: 370px; padding: 36px 36px 30px; z-index: 4; display: flex; flex-direction: column; gap: 16px;
    background: linear-gradient(90deg, rgba(232,234,228,.97) 0%, rgba(232,234,228,.94) 72%, rgba(232,234,228,0) 100%); }
  .clock { display: flex; align-items: baseline; gap: 10px; }
  .clock b { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock span { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #6a7478; }
  .tbar { height: 6px; border-radius: 3px; background: rgba(35,42,44,.18); overflow: hidden; margin-top: 6px; }
  .tbar i { display: block; height: 100%; background: #232a2c; }
  .stats { display: flex; gap: 22px; font-size: 13px; }
  .stats b { display: block; font-size: 22px; font-weight: 600; }
  .go { margin-top: auto; }
  .toast { position: absolute; left: 60%; top: 50%; transform: translate(-50%, -50%); font-size: 24px; letter-spacing: 3px; text-transform: uppercase; color: #f4f1e6; text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 8; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <div class="top" id="bar">
    <b>Campaign map (A)</b>
    <button data-s="new">New campaign</button>
    <button data-s="mid" class="on">Stage 12, back after withdraw</button>
    <button data-s="over">Hour over</button>
    <small>Real game maps and the game's obelisk art: grey shine = Fogbound chief, yellow = your cleared land (stages 1-11 merge into your tile, ×19). Your tile pulses: click it to start. Clock = years before the Fog Tide (1 year = 1 min). Sample numbers.</small>
  </div>
  <div class="stage" id="stage"><div class="frame" id="frame"><div id="lay"></div></div></div>
<script type="module">
  // ---------- frame scaling ----------
  const frame = document.getElementById('frame'), stage = document.getElementById('stage'), bar = document.getElementById('bar');
  function fit() {
    document.documentElement.style.setProperty('--bar', bar.offsetHeight + 'px');
    const s = Math.min(stage.clientWidth / 1280, stage.clientHeight / 720);
    frame.style.transform = `scale(${s}) translate(-50%, -50%)`;
  }
  addEventListener('resize', fit);

  // ---------- captured maps (tools capture: idle stage 1 / stage 12 at 1280x720) ----------
  // per map: u = the game's map unit, home = [x, y, r] of your tile, homePath = its real outline,
  // bots = [x, y, r] of each Fogbound chief's capital
  const MAPS = await (await fetch('img/campaign-maps.json')).json();
  MAPS.s1.img = 'img/campaign-s1.jpg'; MAPS.s12.img = 'img/campaign-s12.jpg';

  // ---------- noise for the fog ----------
  function hash(x, y) { let h = (x * 374761393 + y * 668265263 + 911) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
  function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, y) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

  // fog over every tile but yours: light while the hour runs (you can still see the land you'll
  // fight for), thick once the hour is over (the Fog keeps what you didn't save). soft by nature,
  // so a low-res canvas scaled up is fine
  function drawFog(cv, m, thick) {
    const w = 320, h = 180; cv.width = w; cv.height = h;
    const g = cv.getContext('2d'), im = g.createImageData(w, h), d = im.data;
    const [hx, hy, hr] = m.home;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x * 4, py = y * 4, n = fbm(x / 26, y / 26);
      const dh = Math.hypot(px - hx, (py - hy) * 1.25) / hr;                 // 1 = edge of the home tile
      const clear = Math.max(0, Math.min(1, (dh - 0.9) / 0.6));              // 0 inside home, 1 outside
      const a = clear * (thick ? 0.55 + 0.4 * n : 0.12 + 0.38 * n);
      const o = (y * w + x) * 4; d[o] = 236; d[o + 1] = 238; d[o + 2] = 232; d[o + 3] = Math.min(0.95, a) * 255;
    }
    g.putImageData(im, 0, 0);
  }

  // obelisks: drawn by the game itself (capital-fog / capital-lit scenes, structures.js), so the
  // capture already shows them next to the keeps; the hour-over state adds a big glow on your land
  function drawObelisks(cv, m, st) {
    cv.width = 2560; cv.height = 1440; const g = cv.getContext('2d'); g.scale(2, 2);
    if (!st.over || !m.homeOb) return;
    const [x, y] = m.homeOb, gy = y - m.u * 5.3, r = m.u * 14;
    const gr = g.createRadialGradient(x, gy, 0, x, gy, r);
    gr.addColorStop(0, 'rgba(255, 236, 150, .85)'); gr.addColorStop(0.35, 'rgba(255, 215, 90, .35)'); gr.addColorStop(1, 'rgba(255, 215, 106, 0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, gy, r, 0, 7); g.fill();
  }

  // ---------- sample campaign data ----------
  const icon = {
    creep: '<svg viewBox="0 0 24 24"><path d="M3 15c3-4 6 2 9-2s6 2 9-2"/><path d="M3 20c3-4 6 2 9-2s6 2 9-2"/></svg>',
    rival: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 2 6 5"/></svg>',
    str: '<svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 5-3 8-7 9-4-1-7-4-7-9V7z"/><path d="M9 12l2 2 4-4"/></svg>',
    mist: '<svg viewBox="0 0 24 24"><path d="M4 10h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M6 18h5"/></svg>',
  };
  const mods = [
    { i: 'str', t: 'Fogbound +18% strength', tip: 'Tide III: Fogbound attack, defence and growth are 18% higher than in Tide I.' },
    { i: 'creep', t: 'Fog creep', tip: 'Tide II modifier (sample): every 40 s one of your border tiles with under 10 foglets turns Fogbound.' },
    { i: 'rival', t: 'Early rival', tip: 'Tide III modifier (sample): the second Fogbound chief joins from stage 3 instead of 5.' },
    { i: 'mist', t: 'Mist +45%', tip: 'Higher tide, higher reward: obelisks and bosses drop 45% more Mist (first clear only).', up: true },
  ];
  const modsHtml = () => mods.map((m) => `<div class="mod${m.up ? ' up' : ''}">${icon[m.i]}<span>${m.t}</span><div class="tip">${m.tip}</div></div>`).join('');

  // the clock: 60 years before the Fog Tide, one year per minute of game time
  const STATES = {
    new: { map: 's1', year: 1147, years: 60, lit: false, over: false, label: 'Your village', stageN: 1, obel: 0, mist: 34,
      lore: '112 years ago the last obelisk faded and the Fog came back. Your village is the last free place. Light the obelisks before the next Fog Tide swallows everything.',
      go: 'Defend the village', toast: 'Stage 1' },
    mid: { map: 's12', year: 1169, years: 38, lit: true, over: false, label: 'Stage 12', stageN: 12, obel: 19, mist: 41,
      lore: 'Nineteen obelisks shine around your home. Three Fogbound chiefs still hold the land beyond.',
      go: 'Continue stage 12', toast: 'Stage 12' },
    over: { map: 's12', year: 1207, years: 0, lit: true, over: true, label: '', stageN: 12, obel: 19, mist: 58,
      lore: 'The third Fog Tide has come. Your obelisk holds it back from your land; everything beyond is lost to the Fog again. For now.',
      go: 'Begin year 1312', toast: 'Year 1312' },
  };

  let state = 'mid';
  function show() {
    document.querySelectorAll('.top button[data-s]').forEach((b) => b.classList.toggle('on', b.dataset.s === state));
    const st = STATES[state], m = MAPS[st.map];
    const lay = document.getElementById('lay');
    lay.innerHTML = `
      <div class="map" id="map"><img src="${m.img}" alt=""><canvas class="fogc"></canvas><canvas class="o"></canvas>
        ${st.over ? '' : `<svg class="home" viewBox="0 0 1280 720"><path d="${m.homePath}"><title>${st.label}: click to start</title></path></svg>`}<div id="tags"></div></div>
      <div class="toast" id="toast"></div>
      <div class="col">
        <div><div class="year">Year ${st.year}</div><div class="tide" style="margin-top:8px">${st.over ? 'The third Fog Tide' : 'Before the third Fog Tide'}</div></div>
        <div class="lore">${st.lore}</div>
        <div><div class="clock"><b>${st.years}</b><span>${st.over ? 'The Fog Tide is here' : 'Years before the Fog Tide'}</span></div><div class="tbar"><i style="width:${st.years / 60 * 100}%"></i></div></div>
        <div class="stats"><div><b>${st.stageN} / 30</b>${st.over ? 'Stage reached' : 'Stage'}</div><div><b>${st.obel}</b>Obelisks lit</div><div><b>${st.mist}</b>Mist${st.over ? ' (+17)' : ''}</div></div>
        <div><div class="k">The third tide brings</div>${modsHtml()}</div>
        <div class="go"><button class="ink" data-go>${st.go}</button></div>
      </div>`;
    const map = document.getElementById('map');
    drawFog(map.querySelector('.fogc'), m, st.over);
    drawObelisks(map.querySelector('.o'), m, st);
    // labels: merged obelisk count on your tile, "Fogbound chief" above the grey ones
    const tags = document.getElementById('tags'), [hx, hy, hr] = m.home;
    let t = '';
    if (st.lit && m.homeOb) { const [x, y] = m.homeOb; t += `<div class="tag lit" style="left:${x}px;top:${y - m.u * 6.4 - 26}px">${st.over ? 'Obelisk of 1207 · stages 1-11 saved' : '×19 · stages 1-11'}</div>`; }
    if (!st.over) for (const [x, y] of m.botObs) t += `<div class="tag dark" style="left:${x}px;top:${y - m.u * 6.4 - 26}px">Fogbound chief</div>`;
    tags.innerHTML = t;
    // click your pulsing tile (or the button): zoom in and start (the real game starts the battle)
    const go = () => {
      map.style.transformOrigin = `${hx}px ${hy}px`; map.style.transform = st.over ? 'scale(.4)' : 'scale(3.2)';
      const to = document.getElementById('toast'); to.textContent = st.toast; to.classList.add('on');
      setTimeout(() => { map.style.transform = ''; to.classList.remove('on'); }, 2600);
    };
    const hp = map.querySelector('.home path'); if (hp) hp.onclick = go;
    lay.querySelector('[data-go]').onclick = go;
    fit();
  }
  bar.addEventListener('click', (e) => { if (e.target.dataset.s) { state = e.target.dataset.s; show(); } });
  state = new URLSearchParams(location.search).get('s') || 'mid';   // ?s=new|mid|over opens a state directly
  show();
</script>
</body>
</html>
